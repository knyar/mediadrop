name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mediadrop-test .

      - name: Run tests
        run: |
          docker run --rm mediadrop-test bash -c '
            /app/venv/bin/pip install -r /app/src/dev_requirements.txt &&
            /app/venv/bin/nosetests --where=/app/src
          '
